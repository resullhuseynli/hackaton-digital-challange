# Edge proxy in front of the uvicorn workers.
# - absorbs connection storms (event-driven C accept loop) and reuses keep-alive upstream connections
# - sets X-Forwarded-For from the real peer address, so clients cannot spoof their IP to the rate limiter
worker_processes auto;
events { worker_connections 8192; multi_accept on; }

http {
    access_log off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    client_max_body_size 64k;
    include /etc/nginx/conf.d/*.conf;   # rendered from templates/default.conf.template
}
