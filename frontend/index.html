<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#DC2626" />
    <meta name="description" content="Bakı üçün fövqəladə təxliyə və dispetçer platforması" />
    <title>Bakı Təxliyə</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        var dispatch = location.pathname.indexOf('/dispatch') === 0;
        var dark = dispatch || window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
